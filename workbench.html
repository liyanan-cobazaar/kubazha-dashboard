<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>运营管理工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0;z-index:10}
.top-bar h1{font-size:20px;color:#1a73e8;font-weight:700}
.month-filter{display:flex;gap:6px}
.month-btn{padding:5px 12px;border:1px solid #ddd;border-radius:5px;background:#fff;cursor:pointer;font-size:12px;transition:all .2s}
.month-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.month-btn:hover:not(.active){border-color:#1a73e8;color:#1a73e8}
.main-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:#fff;border-right:1px solid #e2e8f0;padding:14px 0;overflow-y:auto;flex-shrink:0}
.sidebar-title{font-size:11px;color:#aaa;padding:0 20px 10px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;font-size:13px;color:#555;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:#f8fafc;color:#1a73e8}
.nav-item.active{background:#e8f0fe;color:#1a73e8;border-left-color:#1a73e8;font-weight:600}
.nav-icon{font-size:17px;width:22px;text-align:center}
.content-area{flex:1;overflow-y:auto;padding:18px 24px;background:#f5f7fa}
.module-panel{display:none;background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.04);margin-bottom:16px}
.module-panel.active{display:block}
.module-title{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:#1a1a1a}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:#f8fafc;border-radius:8px;padding:12px;text-align:center}
.kpi-card .label{font-size:11px;color:#666;margin-bottom:4px}
.kpi-card .value{font-size:20px;font-weight:700;color:#1a73e8}
.kpi-card .trend{font-size:10px;color:#888;margin-top:2px}
.kpi-card .trend.up{color:#22c55e}.kpi-card .trend.down{color:#ef4444}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f5f9;padding:7px 6px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #e2e8f0;font-size:11px}
td{padding:6px;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.status-ok{background:#22c55e}.status-warn{background:#f59e0b}.status-bad{background:#ef4444}
.chart-container{position:relative;height:220px;margin-top:10px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.chart-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.tab-bar{display:flex;gap:0;border-bottom:2px solid #e2e8f0;margin-bottom:14px}
.tab-btn{padding:7px 16px;cursor:pointer;border:none;background:none;font-size:13px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.score-card{border:1px solid #e2e8f0;border-radius:8px;padding:10px}
.score-card h4{font-size:12px;margin-bottom:6px;color:#444}
.score-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed #eee;font-size:11px}
.score-item > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.score-item > span:last-child{flex-shrink:0;text-align:right;color:#666;font-weight:500;min-width:28px}
.score-item:last-child{border-bottom:none}
.score-input{width:48px;padding:2px 4px;border:1px solid #ddd;border-radius:3px;text-align:center;font-size:11px}
.hint-text{font-size:9px;color:#888;margin-top:1px}
.rank-list{list-style:none}
.rank-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.rank-num{width:24px;height:24px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-right:10px}
.rank-num.top3{background:#fef3c7;color:#b45309}
.rank-name{flex:1;font-weight:500;font-size:12px}
.rank-score{font-size:16px;font-weight:700;color:#1a73e8}
.sub-text{font-size:10px;color:#888}
@media(max-width:900px){.sidebar{width:160px}.kpi-row{grid-template-columns:repeat(2,1fr)}.chart-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <h1>📊 运营管理工作台</h1>
  <div class="month-filter" id="monthFilter"></div>
</div>

<!-- 主体：左导航 + 右内容 -->
<div class="main-body">

  <!-- 左侧导航 -->
  <div class="sidebar">
    <div class="sidebar-title">功能模块</div>
    <div class="nav-item active" data-panel="modOverview" onclick="switchModule(this)"><span class="nav-icon">📈</span>运营概览</div>
    <div class="nav-item" data-panel="modPerformance" onclick="switchModule(this)"><span class="nav-icon">🎯</span>绩效评估</div>
    <div class="nav-item" data-panel="modAction" onclick="switchModule(this)"><span class="nav-icon">⚡</span>运营动作分析</div>
    <div class="nav-item" data-panel="modUserPool" onclick="switchModule(this)"><span class="nav-icon">👥</span>用户池管理</div>
    <div class="nav-item" data-panel="modMarketing" onclick="switchModule(this)"><span class="nav-icon">📢</span>营销活动</div>
    <div class="nav-item" data-panel="modCampus" onclick="switchModule(this)"><span class="nav-icon">🏫</span>校园行管理</div>
  </div>

  <!-- 右侧内容区 -->
  <div class="content-area">

    <!-- 模块1: 运营概览 -->
    <div class="module-panel active" id="modOverview">
      <div class="module-title">📈 运营概览</div>
      <div class="kpi-row" id="overviewKPIs"></div>
      <table><thead><tr><th>区域</th><th>负责人</th><th>项目数</th><th>运营人数</th><th>用户池</th><th>有效触达</th><th>培训场次</th><th>校园行场次</th></tr></thead><tbody id="overviewTable"></tbody></table>
      <div class="chart-row" style="grid-template-columns:1fr"><div class="chart-container" style="height:320px"><canvas id="overviewTrendChart"></canvas></div></div>
      <div class="chart-row" style="grid-template-columns:1fr"><div class="chart-container" style="height:380px"><canvas id="overviewRegionChart"></canvas></div></div>
    </div>

    <!-- 模块2: 绩效评估 -->
    <div class="module-panel" id="modPerformance">
      <div class="module-title">🎯 绩效评估</div>
      <div class="tab-bar" id="perfTabs"></div>
      <div id="perfContent"></div>
    </div>

    <!-- 模块3: 运营动作分析 -->
    <div class="module-panel" id="modAction">
      <div class="module-title">⚡ 运营动作分析</div>
      <div class="kpi-row" id="actionKPIs"></div>
      <div class="chart-row"><div class="chart-container"><canvas id="actionRadarChart"></canvas></div><div class="chart-container"><canvas id="actionBarChart"></canvas></div></div>
    </div>

    <!-- 模块4: 用户池管理 -->
    <div class="module-panel" id="modUserPool">
      <div class="module-title">👥 用户池管理</div>
      <div class="kpi-row" id="userPoolKPIs"></div>
      <table><thead><tr><th>区域</th><th>用户池总量</th><th>人均用户池</th><th>目标(人数×30)</th><th>完成率</th><th>状态</th></tr></thead><tbody id="userPoolTable"></tbody></table>
      <div class="chart-row"><div class="chart-container"><canvas id="userPoolTrendChart"></canvas></div><div class="chart-container"><canvas id="userPoolRegionChart"></canvas></div></div>
    </div>

    <!-- 模块5: 营销活动 -->
    <div class="module-panel" id="modMarketing">
      <div class="module-title">📢 营销活动</div>
      <div class="kpi-row" id="marketingKPIs"></div>
      <table><thead><tr><th>区域</th><th>项目数</th><th>有效触达</th><th>订单额(万)</th><th>结算率</th><th>状态</th></tr></thead><tbody id="marketingTable"></tbody></table>
      <div class="chart-row"><div class="chart-container"><canvas id="marketingComboChart"></canvas></div><div class="chart-container"><canvas id="marketingPieChart"></canvas></div></div>
    </div>

    <!-- 模块6: 校园行管理 -->
    <div class="module-panel" id="modCampus">
      <div class="module-title">🏫 校园行管理</div>
      <div class="kpi-row" id="campusKPIs"></div>
      <table><thead><tr><th>姓名</th><th>岗位</th><th>所属区域</th><th>学校</th><th>校园行场次</th><th>培训场次</th><th>触达次数</th><th>状态</th></tr></thead><tbody id="campusTable"></tbody></table>
      <div class="chart-row"><div class="chart-container"><canvas id="campusTrendChart"></canvas></div><div class="chart-container"><canvas id="campusTopChart"></canvas></div></div>
    </div>

  </div><!-- /content-area -->
</div><!-- /main-body -->

// 返回 {score, ratio, actual, target}
function calcItemScore(actual, target, weight) {
  if(target === 0 || !target || target === null) return {score:0, ratio:0, actual:actual, target:target};
  var ratio = actual / target;
  // 保底30% + 封顶120%
  ratio = Math.max(0.3, Math.min(1.2, ratio));
  var score = Math.round(ratio * weight * 10) / 10;
  return {score: score, ratio: Math.round(ratio*100), actual: actual, target: target};
}

// 获取基期流量：优先同期流量，为0或没有则用上月流量
function getBaseFlow(p) {
  // base_flow_yoy = 同期流量, prev_flow = 上月流量
  if(p.base_flow_yoy && p.base_flow_yoy > 0) return p.base_flow_yoy;
  if(p.prev_flow && p.prev_flow > 0) return p.prev_flow;
  return 0;
}

// 计算增量: 实际产生线上订单金额 - 基期流量
function calcFlowIncrement(p) {
  var actual = p.flow || 0;
  var base = getBaseFlow(p);
  return actual - base;
}

// 按岗位计算客观分（按运营部绩效考核标准）
function calcObjectiveScore(p, role) {
  role = role || p.role;
  var s = 0, details = [];
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  var regions = md ? md.regions : {};

  if(role === "区域主管") {
    // 满分75: 流量增长45 + 结算率15 + 培训8 + 方案输出7
    // ---- 流量增长(45分): 目标=区域基期总流量×1.15, 完成率=当月实际/(基期×1.15) ----
    var rKey = Object.keys(regions).find(function(k){ return regions[k].region === p.region || k === p.name; });
    var regionData = rKey ? regions[rKey] : null;
    var regionActualFlow = regionData ? (regionData.flow || 0) : (p.flow || 0);
    
    // 区域基期流量汇总：区域内各项目基期之和
    var regionBaseFlow = 0;
    if(md && md.people) {
      md.people.forEach(function(pp){
        if(pp.region === p.region && pp.role !== "区域主管") {
          regionBaseFlow += getBaseFlow(pp);
        }
      });
      // 加上区域主管自己的项目行（如果有）
      if(p.flow && p.flow > 0) {
        regionBaseFlow += getBaseFlow(p);
      }
    }
    if(regionBaseFlow <= 0) regionBaseFlow = regionActualFlow / 1.15; // 无基期则反推
    
    var flowTarget = regionBaseFlow * 1.15; // 同比增长15%目标
    var flowResult = calcItemScore(regionActualFlow, flowTarget, 45);
    // 增量 = 实际 - 基期
    var increment = regionActualFlow - regionBaseFlow;
    s += flowResult.score;
    details.push({name:"流量增长", val:(increment/10000).toFixed(2)+"万", 
      ratio:flowResult.ratio, score:flowResult.score, max:45,
      target:(flowTarget/10000).toFixed(2)+"万"});

    // ---- 结算率(15分): 目标85%, 完成=结算率/85% ----
    var sr = parseFloat(p.settle_rate)||0;
    var srVal = sr; // 已经是比例形式如0.91
    var settleResult = calcItemScore(srVal, 0.85, 15);
    s += settleResult.score;
    details.push({name:"结算率", val:(srVal*100).toFixed(1)+"%", 
      ratio:settleResult.ratio, score:settleResult.score, max:15, target:"85%"});

    // ---- 培训(8分): 目标4场/月 ----
    var trainResult = calcItemScore(p.train||0, 4, 8);
    s += trainResult.score;
    details.push({name:"培训", val:p.train||0, 
      ratio:trainResult.ratio, score:trainResult.score, max:8, target:"4场"});

    // ---- 方案输出(7分): 默认B级4分 ----
    s += 4;
    details.push({name:"方案输出", val:"B", ratio:57, score:4, max:7, target:"-"});

  } else if(role === "项目营销负责人") {
    // 满分85: 流量30 + 结算15 + 校园行15 + 培训10 + 用户池8 + 触达7
    // ---- 流量增长(30分): 目标=项目基期流量×1.15 ----
    var pBaseFlow = getBaseFlow(p);
    var pActualFlow = p.flow || 0;
    var pFlowTarget = pBaseFlow > 0 ? pBaseFlow * 1.15 : pActualFlow; // 无基期则以实际为目标(100%)
    var fResult = calcItemScore(pActualFlow, pFlowTarget, 30);
    var pIncrement = pActualFlow - pBaseFlow;
    s += fResult.score;
    details.push({name:"流量增长", val:(pIncrement/10000).toFixed(2)+"万", 
      ratio:fResult.ratio, score:fResult.score, max:30,
      target:(pFlowTarget/10000).toFixed(2)+"万"});

    // ---- 结算率(15分): 目标85% ----
    var sr2 = parseFloat(p.settle_rate)||0;
    var stResult = calcItemScore(sr2, 0.85, 15);
    s += stResult.score;
    details.push({name:"结算率", val:(sr2*100).toFixed(1)+"%", 
      ratio:stResult.ratio, score:stResult.score, max:15, target:"85%"});

    // ---- 校园行(15分): 目标2场/月 ----
    var campResult = calcItemScore(p.campus||0, 2, 15);
    s += campResult.score;
    details.push({name:"校园行", val:p.campus||0, 
      ratio:campResult.ratio, score:campResult.score, max:15, target:"2场"});

    // ---- 培训(10分): 目标4场/月 ----
    var trResult = calcItemScore(p.train||0, 4, 10);
    s += trResult.score;
    details.push({name:"培训", val:p.train||0, 
      ratio:trResult.ratio, score:trResult.score, max:10, target:"4场"});

    // ---- 用户池(8分): 目标30人/月 ----
    var upResult = calcItemScore(p.user_pool||0, 30, 8);
    s += upResult.score;
    details.push({name:"用户池", val:p.user_pool||0, 
      ratio:upResult.ratio, score:upResult.score, max:8, target:"30人"});

    // ---- 触达(7分): 目标100次/月 ----
    var touchResult = calcItemScore(p.touch||0, 100, 7);
    s += touchResult.score;
    details.push({name:"触达", val:p.touch||0, 
      ratio:touchResult.ratio, score:touchResult.score, max:7, target:"100次"});

  } else {
    // 运营专员: 满分85: 校园行20 + 培训15 + 用户池8 + 触达7 + 流量25 + 结算10
    // ---- 校园行(20分): 目标2场/月 ----
    var cResult = calcItemScore(p.campus||0, 2, 20);
    s += cResult.score;
    details.push({name:"校园行", val:p.campus||0, 
      ratio:cResult.ratio, score:cResult.score, max:20, target:"2场"});

    // ---- 培训(15分): 目标4场/月 ----
    var tResult = calcItemScore(p.train||0, 4, 15);
    s += tResult.score;
    details.push({name:"培训", val:p.train||0, 
      ratio:tResult.ratio, score:tResult.score, max:15, target:"4场"});

    // ---- 用户池(8分): 目标30人/月 ----
    var uResult = calcItemScore(p.user_pool||0, 30, 8);
    s += uResult.score;
    details.push({name:"用户池", val:p.user_pool||0, 
      ratio:uResult.ratio, score:uResult.score, max:8, target:"30人"});

    // ---- 触达(7分): 目标100次/月 ----
    var tcResult = calcItemScore(p.touch||0, 100, 7);
    s += tcResult.score;
    details.push({name:"触达", val:p.touch||0, 
      ratio:tcResult.ratio, score:tcResult.score, max:7, target:"100次"});

    // ---- 流量增长(25分): 目标=项目基期×1.15 ----
    var staffBase = getBaseFlow(p);
    var staffActual = p.flow || 0;
    var staffTarget = staffBase > 0 ? staffBase * 1.15 : staffActual;
    var flResult = calcItemScore(staffActual, staffTarget, 25);
    s += flResult.score;
    details.push({name:"流量增长", val:((staffActual-staffBase)/10000).toFixed(2)+"万", 
      ratio:flResult.ratio, score:flResult.score, max:25,
      target:(staffTarget/10000).toFixed(2)+"万"});

    // ---- 结算率(10分): 目标85% ----
    var sr3 = parseFloat(p.settle_rate)||0;
    var seResult = calcItemScore(sr3, 0.85, 10);
    s += seResult.score;
    details.push({name:"结算率", val:(sr3*100).toFixed(1)+"%", 
      ratio:seResult.ratio, score:seResult.score, max:10, target:"85%"});
  }

  return {total: Math.round(s*10)/10, details: details};
}

function statusClass(v, target) {
  if(v==null) return '';
  var p = parseFloat(v), t = parseFloat(target);
  if(isNaN(p)||isNaN(t)||t===0) return 'warn';
  var ratio = p / t;
  if(ratio >= 1) return 'ok';
  if(ratio >= 0.7) return 'warn';
  return 'bad';
}
function statusDot(cls) { return '<span class="status-dot status-'+cls+'"></span>'; }


function renderMonthBtns() {
  var container = $("monthFilter");
  var months = WORKBENCH_DATA.available_months || ["4月","5月","6月","7月"];
  container.innerHTML = "";
  months.forEach(function(m) {
    var btn = document.createElement("button");
    btn.className = "month-btn" + (m === currentMonth ? " active" : "");

    btn.onclick = function() {
      currentMonth = m;
      document.querySelectorAll(".month-btn").forEach(function(b){ b.classList.remove("active"); });

      refreshCurrentModule();
    };
    container.appendChild(btn);
  });
}

var currentModule = "modOverview";

function switchModule(el) {
  var panelId = el.dataset.panel;
  document.querySelectorAll(".nav-item").forEach(function(item){ item.classList.remove("active"); });
  el.classList.add("active");
  document.querySelectorAll(".module-panel").forEach(function(p){ p.classList.remove("active"); });
  $(panelId).classList.add("active");
  currentModule = panelId;
  refreshCurrentModule();
}

function refreshCurrentModule() {
  switch(currentModule) {
    case "modOverview": initOverview(); break;
    case "modPerformance": initPerformance(); break;
    case "modAction": initActionAnalysis(); break;
    case "modUserPool": initUserPool(); break;
    case "modMarketing": initMarketing(); break;
    case "modCampus": initCampus(); break;
  }
}

    '<div class="kpi-card"><div class="label">有效触达</div><div class="value">'+fmt(total.touch)+'</div><div class="trend">目标: ≥'+(total.projects * 100 || 3800)+'次</div></div>' +
    '<div class="kpi-card"><div class="label">培训场次</div><div class="value">'+fmt(total.train)+'</div><div class="trend up">累计覆盖</div></div>' +

    tbody += "<tr><td>"+r.region+"</td><td>"+name+"</td><td>"+r.projects+"</td><td>"+r.members.length+"</td><td>"+fmt(r.user_pool)+"</td><td>"+fmt(r.touch)+"</td><td>"+fmt(r.train)+"</td><td>"+fmt(r.campus)+"</td></tr>";

  // 趋势图 - 各月 flow (单位:万，需除以10000)

  renderLineChart("overviewTrendChart", "月度总流量趋势(万)", months, flowData, "#1a73e8");

  // 区域流量饼图 - 过滤"合计"，按流量降序排列，标题带月份
  var regionArr = regionNames.map(function(k){ return {key:k, name:regions[k].region, flow:(regions[k].flow||0)/10000}; });
  regionArr.sort(function(a,b){ return b.flow - a.flow; });
  renderPieChart("overviewRegionChart", "各区域" + currentMonth + "流量(万)",
    regionArr.map(function(r){ return r.name; }),
    regionArr.map(function(r){ return r.flow; })
  );
}


function initPerformance() {
  var tabs = [{"id":"all","name":"全部"},{"id":"leaders","name":"区域主管"},{"id":"managers","name":"营销负责人"},{"id":"staff","name":"运营专员"},{"id":"ranking","name":"绩效排名"},{"id":"evalChart","name":"绩效评估"}];
  $("perfTabs").innerHTML = tabs.map(function(t){

  }).join("");
  updatePerformanceContent();

function switchPerfTab(mode) {
  currentViewMode = mode;
  document.querySelectorAll("#perfTabs .tab-btn").forEach(function(b){ b.classList.remove("active"); });
  event.target.classList.add("active");
  updatePerformanceContent();
}

function updatePerformanceContent() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;

  // === 绩效排名视图 ===
  if(currentViewMode === "ranking") {
    renderRankingView(md);
    return;
  }

  // === 绩效评估图表视图 ===
  if(currentViewMode === "evalChart") {
    renderEvalChartView(md);
    return;
  }

  var people = md.people || [];
  var filtered = people;
  if(currentViewMode === "leaders") filtered = people.filter(function(p){ return p.role === "区域主管"; });
  else if(currentViewMode === "managers") filtered = people.filter(function(p){ return p.role === "项目营销负责人"; });
  else if(currentViewMode === "staff") filtered = people.filter(function(p){ return p.role === "运营专员"; });

  var out = '<div class="score-grid">';
  filtered.forEach(function(p) {
    var objResult = calcObjectiveScore(p, p.role);
    var objScore = objResult.total;
    var objMax = objResult.details.reduce(function(s,d){return s+d.max;},0);
    var roleFields = SUBJECTIVE_FIELDS[p.role] || [];
    out += '<div class="score-card">';
    out += '<h4>'+p.name+' <span class="sub-text">'+p.role+' · '+p.region+'</span></h4>';

    // 客观分明细 - 显示完成率 + 得分靠右
    objResult.details.forEach(function(d) {
      var targetStr = d.target ? ' 目标'+d.target : '';
      var ratioStr = d.ratio ? d.ratio+'%' : '-';
      out += '<div class="score-item">';
      out += '<span>'+d.name+' ('+fmt(d.val)+')'+targetStr+' <span style="color:#666;font-size:10px">完成'+ratioStr+'</span></span>';
      out += '<span style="font-weight:600;color:#1a73e8">'+d.score.toFixed(1)+'分</span><span style="color:#999;font-size:10px">/'+d.max+'</span>';
      out += '</div>';
    });
    out += '<div class="score-item" style="background:#f0f7ff;border-radius:6px;padding:8px;margin-top:6px"><span><strong>客观小计</strong></span><span style="font-weight:600;color:#1a73e8"><strong>'+objScore+'</strong></span><span style="color:#999;font-size:10px">/'+objMax+'</span></div>';
    
    // 主观分字段
    roleFields.forEach(function(f) {
      var val = subjectiveScores[p.name+"_"+f.key] || "";
      out += '<div class="score-item">';
      out += '<span>'+f.name+' ('+f.weight+')</span>';
      out += '<input class="score-input" type="number" min="0" max="'+parseInt(f.weight)*10+'" value="'+val+'" data-pname="'+p.name+'" data-fkey="'+f.key+'" onchange="updateScore(this.dataset.pname,this.dataset.fkey,this.value)">';
      out += '</div>';
      out += '<div class="hint-text">评分标准: '+f.hint+'</div>';
    });
    
    // 总分
    var subjTotal = calcSubjectiveTotal(p.name, p.role);
    var totalScore = objScore + subjTotal;
    out += '<div class="score-item" style="background:#e8f5e9;border-radius:6px;padding:10px 8px;margin-top:8px"><span><strong>总分</strong></span><span style="font-size:22px;color:#1a73e8;font-weight:700">'+fmt(totalScore)+'</span></div>';
    out += '</div>';
  });
  out += '</div>';
  $("perfContent").innerHTML = out;
}

function updateScore(person, fieldKey, value) {
  subjectiveScores[person+"_"+fieldKey] = value;
  updatePerformanceContent();
}

function calcSubjectiveTotal(person, role) {
  var fields = SUBJECTIVE_FIELDS[role] || [];
  var total = 0;
  fields.forEach(function(f) {
    var v = parseFloat(subjectiveScores[person+"_"+f.key]) || 0;
    total += v;
  });
  return total;
}

// 绩效排名视图（排行榜）
function renderRankingView(md) {
  var people = md.people || [];

  var scored = people.map(function(p) {
    var objResult = calcObjectiveScore(p, p.role);
    var obj = objResult.total;
    var subj = calcSubjectiveTotal(p.name, p.role);
    return {
      name:p.name, role:p.role, region:p.region,
      total: obj + subj, objective: obj, subjective: subj,
      user_pool:p.user_pool, touch:p.touch,
      campus:p.campus, train:p.train, flow:p.flow,
      actual_order:p.actual_order, settle_rate:p.settle_rate
    };
  });

  // 区域主管排行
  var leaders = scored.filter(function(p){ return p.role === "区域主管"; }).sort(function(a,b){ return b.total-a.total; });
  var leaderHtml = leaders.length ? leaders.map(function(p,i){
    return '<li class="rank-item"><span class="rank-num'+(i<3?' top3':'')+'">'+(i+1)+'</span><span class="rank-name">'+p.name+'('+p.region+')</span><span class="rank-score">'+fmt(p.total)+'</span></li>';
  }).join("") : '<li class="rank-item"><span style="color:#999">暂无数据</span></li>';

  // 其他人员排行
  var staff = scored.filter(function(p){ return p.role !== "区域主管"; }).sort(function(a,b){ return b.total-a.total; });
  var staffHtml = staff.length ? staff.slice(0,15).map(function(p,i){
    return '<li class="rank-item"><span class="rank-num'+(i<3?' top3':'')+'">'+(i+1)+'</span><span class="rank-name">'+p.name+' <span class="sub-text">'+p.role+'</span></span><span class="rank-score">'+fmt(p.total)+'</span></li>';
  }).join("") : '<li class="rank-item"><span style="color:#999">暂无数据</span></li>';

  var out = '';
  out += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">';
  out += '<div><h4 style="margin-bottom:10px;font-size:14px">👔 区域主管排行</h4><ul class="rank-list">'+leaderHtml+'</ul></div>';
  out += '<div><h4 style="margin-bottom:10px;font-size:14px">👥 其他人员排行</h4><ul class="rank-list">'+staffHtml+'</ul></div>';
  out += '</div>';

  $("perfContent").innerHTML = out;
}

// 绩效评估图表视图
function renderEvalChartView(md) {
  var people = md.people || [];

  var scored = people.map(function(p) {
    var objResult = calcObjectiveScore(p, p.role);
    var obj = objResult.total;
    var subj = calcSubjectiveTotal(p.name, p.role);
    return {
      name:p.name, role:p.role, region:p.region,
      total: obj + subj, objective: obj, subjective: subj,
      user_pool:p.user_pool, touch:p.touch,
      campus:p.campus, train:p.train, flow:p.flow,
      actual_order:p.actual_order, settle_rate:p.settle_rate
    };
  });

  // 图表 - 纵向排列，每个图独占一行更大
  var out = '';
  out += '<div class="chart-container" style="height:340px"><canvas id="perfSummaryLeaderChart"></canvas></div>';
  out += '<div class="chart-container" style="height:340px"><canvas id="perfSummaryMarketingChart"></canvas></div>';
  out += '<div class="chart-container" style="height:340px"><canvas id="perfSummaryStaffChart"></canvas></div>';

  $("perfContent").innerHTML = out;

  // 渲染图表
  // 1) 区域主管: 绩效 vs 区域总流量(万) — 从regions取区域汇总的线上订单金额
  var leaders = scored.filter(function(p){ return p.role === "区域主管"; }).sort(function(a,b){ return b.total-a.total; });
  var regions = md.regions || {};
  if(leaders.length > 0) {
    renderComboChart("perfSummaryLeaderChart", "区域主管-绩效vs区域流量(万)",
      leaders.map(function(p){return p.name;}),
      leaders.map(function(p){return p.total;}),
      leaders.map(function(p){
        // 从regions中按人名查找该区域的汇总flow
        var rKey = Object.keys(regions).find(function(k){ return regions[k].region === p.region || k === p.name; });
        var r = rKey ? regions[rKey] : null;
        return r ? (r.flow||0) / 10000 : (p.flow||0) / 10000;
      }), "流量(万)"
    );
  }
  // 2) 营销负责人: 绩效 vs 项目流量(万) — 用个人实际产生线上订单金额
  var mgrs = scored.filter(function(p){ return p.role === "项目营销负责人"; }).sort(function(a,b){ return b.total-a.total; });
  if(mgrs.length > 0) {
    renderComboChart("perfSummaryMarketingChart", "营销负责人-绩效vs项目流量(万)",
      mgrs.map(function(p){return p.name;}),
      mgrs.map(function(p){return p.total;}),
      mgrs.map(function(p){return (p.flow||0) / 10000;}), "项目流量(万)"
    );
  }
  var stf = scored.filter(function(p){ return p.role === "运营专员"; }).sort(function(a,b){ return b.total-a.total; });
  if(stf.length > 0) {
    renderMultiComboChart("perfSummaryStaffChart", "运营专员-绩效vs多指标",
      stf.map(function(p){return p.name;}),
      stf.map(function(p){return p.total;}),
      [stf.map(function(p){return p.campus||0;}),
       stf.map(function(p){return p.train||0;}),
       stf.map(function(p){return p.user_pool||0;}),
       stf.map(function(p){return p.touch||0;})],
      ["校园行","培训","用户池","触达"], "数量"
    );
  }
}


function initActionAnalysis() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var opCount = total.operators || 1;

  $("actionKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">人均触达</div><div class="value">'+fmt((total.touch||0)/opCount)+'</div><div class="trend">次/人</div></div>' +
    '<div class="kpi-card"><div class="label">人均校园行</div><div class="value">'+fmt((total.campus||0)/opCount)+'</div><div class="trend">场/人</div></div>' +
    '<div class="kpi-card"><div class="label">人均培训</div><div class="value">'+fmt((total.train||0)/opCount)+'</div><div class="trend">场/人</div></div>' +
    '<div class="kpi-card"><div class="label">平均结算率</div><div class="value">'+calcAvgSettle(md.people)+'%</div><div class="trend">基准: ≥90%</div></div>';

  // 雷达图 - TOP5按触达排序
  var people = (md.people || []).slice().sort(function(a,b){ return (b.touch||0)-(a.touch||0); }).slice(0,5);
  renderRadarChart("actionRadarChart", "TOP5运营人员能力雷达",
    people.map(function(p){return p.name;}),
    [{label:"有效触达",data:people.map(function(p){return p.touch||0;})},
     {label:"校园行",data:people.map(function(p){return p.campus||0;})},
     {label:"培训",data:people.map(function(p){return p.train||0;})},
     {label:"用户池",data:people.map(function(p){return p.user_pool||0;})}]
  );

  // 柱状图 - 各区域指标对比(过滤合计)
  var regions = md.regions || {};
  var rNames = Object.keys(regions).filter(function(n){ return n !== '合计'; });
  renderGroupedBarChart("actionBarChart", "各区域核心指标对比",
    rNames.map(function(k){return regions[k].region;}),
    [{label:"触达",data:rNames.map(function(k){return regions[k].touch||0;}),color:"#1a73e8"},
     {label:"校园行",data:rNames.map(function(k){return regions[k].campus||0;}),color:"#22c55e"},
     {label:"培训",data:rNames.map(function(k){return regions[k].train||0;}),color:"#f59e0b"}]
  );
}

function calcAvgSettle(people) {
  if(!people || !people.length) return "0.0";
  var sum = 0, cnt = 0;
  people.forEach(function(p) {
    var sr = parseFloat(p.settle_rate);
    if(!isNaN(sr)) { sum += sr * 100; cnt++; }
  });
  return cnt > 0 ? (sum/cnt).toFixed(1) : "0.0";
}


function initUserPool() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var regions = md.regions || {};
  var opCount = total.operators || 1;

  // KPI - 目标=人数×30(人均目标)
  var poolTotal = total.user_pool || 0;
  var targetPool = opCount * 30;
  $("userPoolKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">用户池总量</div><div class="value">'+fmt(poolTotal)+'</div><div class="trend">目标: ≥'+targetPool+'</div></div>' +
    '<div class="kpi-card"><div class="label">人均用户池</div><div class="value">'+fmt(poolTotal/opCount)+'</div><div class="trend">基准: 30人/人</div></div>' +
    '<div class="kpi-card"><div class="label">运营人数</div><div class="value">'+opCount+'</div><div class="trend up">在岗人员</div></div>' +
    '<div class="kpi-card"><div class="label">目标完成率</div><div class="value">'+fmt((poolTotal/targetPool)*100)+'%</div><div class="trend '+(poolTotal>=targetPool?'up':'down')+'">'+(poolTotal>=targetPool?'已达标':(poolTotal/targetPool>=0.3?'需努力':'待提升'))+'</div></div>';

  // 表格 - 过滤合计，目标=区域人数×30, 完成率<30%为待提升
  var tbody = "";
  Object.keys(regions).filter(function(n){ return n !== '合计'; }).forEach(function(name) {
    var r = regions[name];
    var pool = r.user_pool || 0;
    var memberCnt = r.members.length || 1;
    var perPerson = pool / memberCnt;
    var regionTarget = memberCnt * 30;
    var rate = regionTarget > 0 ? (pool / regionTarget * 100) : 0;
    var cls = rate >= 100 ? "ok" : (rate >= 30 ? "warn" : "bad");
    tbody += "<tr><td>"+r.region+"</td><td>"+fmt(pool)+"</td><td>"+fmt(perPerson)+"</td><td>"+memberCnt+"×30="+regionTarget+"</td><td>"+fmt(rate)+"%</td><td>"+statusDot(cls)+(rate>=100?"达标":(rate>=30?"接近":"待提升"))+"</td></tr>";
  });
  $("userPoolTable").innerHTML = tbody;

  // 趋势图
  var months = Object.keys(WORKBENCH_DATA.totals).sort();
  var poolTrend = months.map(function(m) {
    var rgn = WORKBENCH_DATA.monthly_data[m].regions || {};
    var t = WORKBENCH_DATA.totals[m];
    return t.user_pool || 0;
  });
  renderLineChart("userPoolTrendChart", "用户池月度趋势", months, poolTrend, "#22c55e");

  // 区域对比(过滤合计)
  var rNames = Object.keys(regions).filter(function(n){ return n !== '合计'; });
  renderBarChart("userPoolRegionChart", "各区域用户池",
    rNames.map(function(k){return regions[k].region;}),
    rNames.map(function(k){return regions[k].user_pool||0;})
  );
}


function initMarketing() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var regions = md.regions || {};

  // 从people计算订单总额和平均结算率
  var people = md.people || [];
  var orderTotal = 0, settleSum = 0, settleCnt = 0;
  people.forEach(function(p) {
    orderTotal += p.actual_order || 0;
    var sr = parseFloat(p.settle_rate);
    if(!isNaN(sr)) { settleSum += sr; settleCnt++; }
  });

  $("marketingKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">项目总数</div><div class="value">'+(total.projects||0)+'</div><div class="trend">在运营项目</div></div>' +
    '<div class="kpi-card"><div class="label">有效触达</div><div class="value">'+fmt(total.touch)+'</div><div class="trend">全平台累计</div></div>' +
    '<div class="kpi-card"><div class="label">订单总额(万)</div><div class="value">'+fmt(orderTotal/10000)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">平均结算率</div><div class="value">'+(settleCnt>0?fmt(settleSum/settleCnt*100):'0.0')+'%</div><div class="trend">基准: ≥90%</div></div>';

  // 表格(过滤合计)
  var tbody = "";
  Object.keys(regions).filter(function(n){ return n !== '合计'; }).forEach(function(name) {
    var r = regions[name];
    var t = r.touch || 0;
    // 该区域人员的订单额和结算率
    var rPeople = people.filter(function(p){ return p.leader === name; });
    var rOrder = 0, rSettle = 0, rSCnt = 0;
    rPeople.forEach(function(p) {
      rOrder += p.actual_order || 0;
      var sr = parseFloat(p.settle_rate);
      if(!isNaN(sr)) { rSettle += sr; rSCnt++; }
    });
    var avgSR = rSCnt > 0 ? (rSettle/rSCnt*100).toFixed(1) : "0.0";
    var cls = parseFloat(avgSR) >= 90 ? "ok" : (parseFloat(avgSR) >= 70 ? "warn" : "bad");
    tbody += "<tr><td>"+r.region+"</td><td>"+r.projects+"</td><td>"+fmt(t)+"</td><td>"+fmt(rOrder/10000)+"</td><td>"+avgSR+"%</td><td>"+statusDot(cls)+(parseFloat(avgSR)>=90?"达标":"待提升")+"</td></tr>";
  });
  $("marketingTable").innerHTML = tbody;

  // 组合图: 触达 vs 流量(万)(过滤合计)
  var rNames = Object.keys(regions).filter(function(n){ return n !== '合计'; });
  renderComboChart("marketingComboChart", "各区域触达-流量关系",
    rNames.map(function(k){return regions[k].region;}),
    rNames.map(function(k){return regions[k].touch||0;}),
    rNames.map(function(k){return (regions[k].flow||0) / 10000;})
  );

  // 饼图: 项目数分布(过滤合计，按数量降序)
  var projArr = rNames.map(function(k){ return {name:regions[k].region, projects:regions[k].projects||0}; });
  projArr.sort(function(a,b){ return b.projects - a.projects; });
  renderPieChart("marketingPieChart", "区域项目数分布",
    projArr.map(function(r){ return r.name; }),
    projArr.map(function(r){ return r.projects; })
  );
}


function initCampus() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var people = md.people || [];

  var campusTotal = total.campus || 0;
  var trainTotal = total.train || 0;

  $("campusKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">校园行总场次</div><div class="value">'+fmt(campusTotal)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">培训总场次</div><div class="value">'+fmt(trainTotal)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">参与运营人数</div><div class="value">'+people.length+'</div><div class="trend">人</div></div>' +
    '<div class="kpi-card"><div class="label">有校园行人数</div><div class="value">'+people.filter(function(p){return (p.campus||0)>0}).length+'</div><div class="trend up">活跃人员</div></div>';

  // 表格 - 显示每个人详情
  var tbody = "";
  people.forEach(function(p) {
    var cls = (p.campus||0) >= 2 ? "ok" : ((p.campus||0) > 0 ? "warn" : "bad");
    tbody += "<tr><td>"+p.name+"</td><td>"+p.role+"</td><td>"+p.region+"</td><td>"+p.school+"</td><td>"+(p.campus||0)+"</td><td>"+(p.train||0)+"</td><td>"+(p.touch||0)+"</td><td>"+statusDot(cls)+((p.campus||0)>=2?"积极":((p.campus||0)>0?"参与中":"待开展"))+"</td></tr>";
  });
  $("campusTable").innerHTML = tbody;

  // 趋势图
  var months = Object.keys(WORKBENCH_DATA.totals).sort();
  var campusTrend = months.map(function(m){ return (WORKBENCH_DATA.totals[m].campus||0); });
  renderLineChart("campusTrendChart", "校园行月度趋势", months, campusTrend, "#f59e0b");

  // TOP10 按校园行排序
  var topPeople = people.slice().sort(function(a,b){ return (b.campus||0)-(a.campus||0); }).slice(0,10);
  renderBarChart("campusTopChart", "校园行TOP10",
    topPeople.map(function(p){return p.name;}),
    topPeople.map(function(p){return p.campus||0;})
  );
}

function renderLineChart(canvasId, title, labels, data, color) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  allCharts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: [{ label: title, data: data, borderColor: color, backgroundColor: color + '20', fill: true, tension: 0.3 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: title, font: { size: 13 } },
        datalabels: { display: true, color: color, font: { size: 9, weight: 'bold' }, align: 'top', formatter: function(v) { return v > 0 ? v.toFixed(1) : ''; } } },
      scales: { y: { beginAtZero: true } } }
  });
}

function renderBarChart(canvasId, title, labels, data) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  allCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: title, data: data, backgroundColor: '#1a73e880', borderColor: '#1a73e8', borderWidth: 1 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, title: { display: true, text: title, font: { size: 13 } },
        datalabels: { display: function(c) { return c.dataset.data[c.dataIndex] > 0; }, anchor: 'end', align: 'top', color: '#1a73e8', font: { size: 9, weight: 'bold' }, offset: 2, formatter: function(v) { if (v === 0) return ''; if (v >= 10000) return (v / 10000).toFixed(1) + '万'; return v.toFixed(0); } } },
      scales: { y: { beginAtZero: true } } }
  });
}

function renderRadarChart(canvasId, title, labels, datasets) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  var colors = ['#1a73e8','#22c55e','#f59e0b','#ef4444','#8b5cf6'];
  var ds = datasets.map(function(d, i) { return { label: d.label, data: d.data, borderColor: colors[i], backgroundColor: colors[i] + '20' }; });
  allCharts[canvasId] = new Chart(ctx, {
    type: 'radar',
    data: { labels: labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { title: { display: true, text: title, font: { size: 13 } } },
      scales: { r: { beginAtZero: true } } }
  });
}

function renderGroupedBarChart(canvasId, title, labels, datasets) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  var ds = datasets.map(function(d) { return { label: d.label, data: d.data, backgroundColor: (d.color || '#1a73e8') + '80', borderColor: d.color || '#1a73e8', borderWidth: 1 }; });
  allCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 10 } } }, title: { display: true, text: title, font: { size: 13 } },
        datalabels: { display: function(c) { return c.dataset.data[c.dataIndex] > 0; }, anchor: 'end', align: 'top', color: '#333', font: { size: 8, weight: 'bold' }, offset: 2, formatter: function(v) { if (v === 0) return ''; if (v >= 10000) return (v / 10000).toFixed(1) + '万'; return v.toFixed(0); } } },
      scales: { y: { beginAtZero: true } } }
  });
}

function renderComboChart(canvasId, title, labels, lineData, barData, barUnit) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  var unit = barUnit || '\u6570\u91cf';
  allCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: [
      { label: '\u6307\u6807(\u67f1)', data: barData, backgroundColor: '#22c55e80', borderColor: '#22c55e', borderWidth: 1, yAxisID: 'y' },
      { type: 'line', label: '\u7ee9\u6548(\u7ebf)', data: lineData, borderColor: '#ef4444', backgroundColor: '#ef444420', tension: 0.3, yAxisID: 'y1' }
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { title: { display: true, text: title, font: { size: 13, weight: 'bold' } },
        legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 10 } } },
        datalabels: { display: function(c) { return c.dataset.type !== 'line' && c.dataset.data[c.dataIndex] > 0; }, anchor: 'end', align: 'top', color: '#166534', font: { size: 9, weight: 'bold' }, offset: 2, formatter: function(v) { if (v === 0) return ''; if (v >= 10000) return (v / 10000).toFixed(1) + '\u4e07'; return v.toFixed(0); } } },
      scales: { y: { beginAtZero: true, position: 'left', title: { display: true, text: unit, font: { size: 11 } } },
        y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '\u7ee9\u6548\u5206', font: { size: 11 } } } }
    }
  });
}

function renderMultiComboChart(canvasId, title, labels, lineData, barDatasets, barLabels, barUnit) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  var unit = barUnit || '\u6570\u91cf';
  var barColors = ['#22c55e80','#f59e0b80','#8b5cf680','#1a73e880'];
  var ds = [{ type: 'line', label: '\u7ee9\u6548(\u7ebf)', data: lineData, borderColor: '#ef4444', backgroundColor: '#ef444420', tension: 0.3, yAxisID: 'y1' }];
  barDatasets.forEach(function(d, i) { ds.push({ label: barLabels[i], data: d, backgroundColor: barColors[i], borderWidth: 0, yAxisID: 'y' }); });
  allCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { title: { display: true, text: title, font: { size: 13, weight: 'bold' } },
        legend: { display: true, position: 'top', labels: { boxWidth: 12, font: { size: 10 } } },
        datalabels: { display: function(c) { return c.dataset.type !== 'line' && c.dataset.data[c.dataIndex] > 0; }, anchor: 'end', align: 'top', color: '#333', font: { size: 8, weight: 'bold' }, offset: 2, formatter: function(v) { if (v === 0) return ''; if (v >= 10000) return (v / 10000).toFixed(1) + '\u4e07'; return v.toFixed(0); } } },
      scales: { y: { beginAtZero: true, position: 'left', stacked: false, title: { display: true, text: unit, font: { size: 11 } } },
        y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '\u7ee9\u6548\u5206', font: { size: 11 } } } }
    }
  });
}

function renderPieChart(canvasId, title, labels, data) {
  if (allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if (!ctx) return;
  // \u9ad8\u7ea7\u5546\u52a1\u8272\u7cfb - \u83ab\u5170\u8fea\u98ce\u683c
  var colors = ['#4A90D9','#50C878','#F5A623','#E85D75','#9B59B6','#1ABC9C','#E67E22','#3498DB','#2ECC71','#E74C3C'];
  var total = data.reduce(function(a, b) { return a + b; }, 0);
  var legendLabels = labels.map(function(l, i) {
    var v = data[i] || 0;
    var pct = total > 0 ? (v / total * 100).toFixed(1) + '%' : '0%';
    return l + ' ' + pct;
  });
  allCharts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: legendLabels, datasets: [{ data: data, backgroundColor: colors.slice(0, data.length), borderWidth: 2, borderColor: '#fff', hoverOffset: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '55%',
      plugins: { title: { display: true, text: title, font: { size: 14, weight: '600' } },
        legend: { display: true, position: 'right', labels: { boxWidth: 14, font: { size: 11 }, padding: 12, generateLabels: function(chart) {
          var ds = chart.data.datasets[0];
          return chart.data.labels.map(function(l, i) {
            return { text: l, fillStyle: ds.backgroundColor[i], hidden: false, index: i };
          });
        }} },
        datalabels: {
          display: true,
          color: '#fff',
          font: { size: 11, weight: 'bold' },
          textAlign: 'center',
          formatter: function(value, context) {
            var label = labels[context.dataIndex] || '';
            var pct = total > 0 ? (value / total * 100) : 0;
            // \u5c0f\u4e8e8%\u53ea\u663e\u793a\u540d\u79f0\uff0c\u5927\u4e8e8%\u663e\u793a\u540d\u79f0+\u767e\u5206\u6bd4
            if (pct < 8) return label;
            return label + '\n' + pct.toFixed(1) + '%';
          },
          anchor: function(context) {
            var v = data[context.dataIndex] || 0;
            var pct = total > 0 ? (v / total * 100) : 0;
            return pct < 10 ? 'end' : 'center';
          },
          align: function(context) {
            var v = data[context.dataIndex] || 0;
            var pct = total > 0 ? (v / total * 100) : 0;
            return pct < 10 ? 'end' : 'center';
          },
          offset: function(context) {
            var v = data[context.dataIndex] || 0;
            var pct = total > 0 ? (v / total * 100) : 0;
            return pct < 10 ? 16 : 0;
          },
          connector: { color: '#999', width: 1, borderDash: [3, 2] }
        } }
    }
  });
}
