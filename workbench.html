<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>运营管理工作台 v7</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:24px;color:#1a73e8}
.month-filter{display:flex;gap:8px}
.month-btn{padding:6px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.month-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.module{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.module-title{font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:#f8fafc;border-radius:10px;padding:16px;text-align:center}
.kpi-card .label{font-size:12px;color:#666;margin-bottom:6px}
.kpi-card .value{font-size:26px;font-weight:700;color:#1a73e8}
.kpi-card .value small{font-size:13px;font-weight:400}
.kpi-card .trend{font-size:11px;color:#888;margin-top:4px}
.kpi-card .trend.up{color:#22c55e}.kpi-card .trend.down{color:#ef4444}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;padding:10px 8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #e2e8f0}
td{padding:8px;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-ok{background:#22c55e}.status-warn{background:#f59e0b}.status-bad{background:#ef4444}
.chart-container{position:relative;height:280px;margin-top:12px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.tab-bar{display:flex;gap:0;border-bottom:2px solid #e2e8f0;margin-bottom:16px}
.tab-btn{padding:8px 20px;cursor:pointer;border:none;background:none;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:12px}
.score-card{border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.score-card h4{font-size:14px;margin-bottom:10px;color:#444}
.score-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eee}
.score-item:last-child{border-bottom:none}
.score-input{width:60px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;text-align:center;font-size:13px}
.hint-text{font-size:11px;color:#888;margin-top:4px}
.rank-list{list-style:none}
.rank-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.rank-num{width:28px;height:28px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-right:12px}
.rank-num.top3{background:#fef3c7;color:#b45309}
.rank-name{flex:1;font-weight:500}
.rank-score{font-size:18px;font-weight:700;color:#1a73e8}
.sub-text{font-size:11px;color:#888}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.chart-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <h1>📊 运营管理工作台</h1>
  <div class="month-filter" id="monthFilter"></div>
</div>

<!-- 模块1: 运营概览 -->
<div class="module" id="modOverview">
  <div class="module-title">📈 运营概览</div>
  <div class="kpi-row" id="overviewKPIs"></div>
  <table><thead><tr><th>区域</th><th>负责人</th><th>项目数</th><th>运营人数</th><th>用户池</th><th>有效触达</th><th>培训场次</th><th>校园行场次</th></tr></thead><tbody id="overviewTable"></tbody></table>
  <div class="chart-row"><div class="chart-container"><canvas id="overviewTrendChart"></canvas></div><div class="chart-container"><canvas id="overviewRegionChart"></canvas></div></div>
</div>

<!-- 模块2: 绩效评估 -->
<div class="module" id="modPerformance">
  <div class="module-title">🎯 绩效评估</div>
  <div class="tab-bar" id="perfTabs"></div>
  <div id="perfContent"></div>
</div>

<!-- 模块3: 运营动作分析 -->
<div class="module" id="modAction">
  <div class="module-title">⚡ 运营动作分析</div>
  <div class="kpi-row" id="actionKPIs"></div>
  <div class="chart-row"><div class="chart-container"><canvas id="actionRadarChart"></canvas></div><div class="chart-container"><canvas id="actionBarChart"></canvas></div></div>
</div>

<!-- 模块4: 用户池管理 -->
<div class="module" id="modUserPool">
  <div class="module-title">👥 用户池管理</div>
  <div class="kpi-row" id="userPoolKPIs"></div>
  <table><thead><tr><th>区域</th><th>用户池总量</th><th>本月新增(估)</th><th>人均用户池</th><th>目标完成率</th><th>状态</th></tr></thead><tbody id="userPoolTable"></tbody></table>
  <div class="chart-row"><div class="chart-container"><canvas id="userPoolTrendChart"></canvas></div><div class="chart-container"><canvas id="userPoolRegionChart"></canvas></div></div>
</div>

<!-- 模块5: 营销活动 -->
<div class="module" id="modMarketing">
  <div class="module-title">📢 营销活动</div>
  <div class="kpi-row" id="marketingKPIs"></div>
  <table><thead><tr><th>区域</th><th>项目数</th><th>有效触达</th><th>订单额(万)</th><th>结算率</th><th>状态</th></tr></thead><tbody id="marketingTable"></tbody></table>
  <div class="chart-row"><div class="chart-container"><canvas id="marketingComboChart"></canvas></div><div class="chart-container"><canvas id="marketingPieChart"></canvas></div></div>
</div>

<!-- 模块6: 校园行管理 -->
<div class="module" id="modCampus">
  <div class="module-title">🏫 校园行管理</div>
  <div class="kpi-row" id="campusKPIs"></div>
  <table><thead><tr><th>姓名</th><th>岗位</th><th>所属区域</th><th>学校</th><th>校园行场次</th><th>培训场次</th><th>触达次数</th><th>状态</th></tr></thead><tbody id="campusTable"></tbody></table>
  <div class="chart-row"><div class="chart-container"><canvas id="campusTrendChart"></canvas></div><div class="chart-container"><canvas id="campusTopChart"></canvas></div></div>
</div>

<!-- 模块7: 全员汇总 -->
<div class="module" id="modSummary">
  <div class="module-title">🏆 全员绩效汇总</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div><h4 style="margin-bottom:10px">👔 区域主管排行</h4><ul class="rank-list" id="leaderRankList"></ul></div>
    <div><h4 style="margin-bottom:10px">👥 其他人员排行</h4><ul class="rank-list" id="staffRankList"></ul></div>
  </div>
  <div class="chart-row" style="margin-top:16px">
    <div class="chart-container"><canvas id="summaryLeaderChart"></canvas></div>
    <div class="chart-container"><canvas id="summaryMarketingChart"></canvas></div>
    <div class="chart-container"><canvas id="summaryStaffChart"></canvas></div>
  </div>
</div>

function fmt(n) {
  if(n==null||n==='') return '-';
  var f = parseFloat(n);
  return isNaN(f) ? '-' : f.toFixed(1).replace(/\.0$/,'');
}

// 计算单项得分: 完成率*权重, 保底30%, 上限120%
function calcItemScore(actual, target, weight) {
  if(target === 0 || !target) return 0;
  var ratio = Math.max(0.3, Math.min(1.2, actual / target));
  return Math.round(ratio * weight * 10) / 10;
}

// 按岗位计算客观分
function calcObjectiveScore(p, role) {
  role = role || p.role;
  var s = 0, details = [];

  if(role === "区域主管") {
    // 满分75: 流量45 + 结算15 + 培训8 + 方案7
    // 流量增长率(45%): 用区域总流量估算, 暂用个人flow占比
    var flowScore = Math.min(54, ((p.flow||0)/50 * 45)); // 简化估算
    s += flowScore; details.push({name:"流量增长", val:p.flow||0, score:flowScore, max:45});
    // 结算率(15%): settle_rate转数字
    var sr = parseFloat(p.settle_rate)||0.5;
    var settleScore = Math.min(15, Math.max(4.5, sr/0.85*15));
    s += settleScore; details.push({name:"结算率", val:(sr*100).toFixed(1)+"%", score:settleScore, max:15});
    // 培训(8%, 目标4场)
    var trainS = calcItemScore(p.train||0, 4, 8);
    s += trainS; details.push({name:"培训", val:p.train||0, score:trainS, max:8, target:"4场"});
    // 方案输出(7%): 默认B级4分(无数据时)
    s += 4; details.push({name:"方案输出", val:"B", score:4, max:7});

  } else if(role === "项目营销负责人") {
    // 满分85: 流量30 + 结算15 + 校园行15 + 培训10 + 用户池8 + 触达7
    var fScore = calcItemScore(p.flow||0, 50, 30);
    s += fScore; details.push({name:"流量增长", val:(p.flow||0).toFixed(1)+"万", score:fScore, max:30});
    var sr2 = parseFloat(p.settle_rate)||0.5;
    var stScore = calcItemScore(sr2, 0.85, 15);
    s += stScore; details.push({name:"结算率", val:(sr2*100).toFixed(1)+"%", score:stScore, max:15});
    var campScore = calcItemScore(p.campus||0, 2, 15);
    s += campScore; details.push({name:"校园行", val:p.campus||0, score:campScore, max:15, target:"2场"});
    var trScore = calcItemScore(p.train||0, 4, 10);
    s += trScore; details.push({name:"培训", val:p.train||0, score:trScore, max:10, target:"4场"});
    var upScore = calcItemScore(p.user_pool||0, 30, 8);
    s += upScore; details.push({name:"用户池", val:p.user_pool||0, score:upScore, max:8, target:"30人"});
    var touchScore = calcItemScore(p.touch||0, 100, 7);
    s += touchScore; details.push({name:"触达", val:p.touch||0, score:touchScore, max:7, target:"100次"});

  } else {
    // 运营专员: 满分85: 校园行20 + 培训15 + 用户池8 + 触达7 + 流量25 + 结算10
    var cScore = calcItemScore(p.campus||0, 2, 20);
    s += cScore; details.push({name:"校园行", val:p.campus||0, score:cScore, max:20, target:"2场"});
    var tScore = calcItemScore(p.train||0, 4, 15);
    s += tScore; details.push({name:"培训", val:p.train||0, score:tScore, max:15, target:"4场"});
    var uScore = calcItemScore(p.user_pool||0, 30, 8);
    s += uScore; details.push({name:"用户池", val:p.user_pool||0, score:uScore, max:8, target:"30人"});
    var tcScore = calcItemScore(p.touch||0, 100, 7);
    s += tcScore; details.push({name:"触达", val:p.touch||0, score:tcScore, max:7, target:"100次"});
    var flScore = calcItemScore(p.flow||0, 30, 25);
    s += flScore; details.push({name:"流量增长", val:(p.flow||0).toFixed(1)+"万", score:flScore, max:25});
    var sr3 = parseFloat(p.settle_rate)||0.5;
    var seScore = calcItemScore(sr3, 0.85, 10);
    s += seScore; details.push({name:"结算率", val:(sr3*100).toFixed(1)+"%", score:seScore, max:10});
  }

  return {total: Math.round(s*10)/10, details: details};
}

function statusClass(v, target) {
  if(v==null) return '';
  var p = parseFloat(v), t = parseFloat(target);
  if(isNaN(p)||isNaN(t)||t===0) return 'warn';
  var ratio = p / t;
  if(ratio >= 1) return 'ok';
  if(ratio >= 0.7) return 'warn';
  return 'bad';
}

function renderMonthBtns() {
  var container = $("monthFilter");

  container.innerHTML = "";
  months.forEach(function(m) {
    var btn = document.createElement("button");
    btn.className = "month-btn" + (m === currentMonth ? " active" : "");
    btn.textContent = m;

    container.appendChild(btn);
  });
}

function updatePerformanceContent() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var people = md.people || [];
  var filtered = people;
  if(currentViewMode === "leaders") filtered = people.filter(function(p){ return p.role === "区域主管"; });
  else if(currentViewMode === "managers") filtered = people.filter(function(p){ return p.role === "项目营销负责人"; });
  else if(currentViewMode === "staff") filtered = people.filter(function(p){ return p.role === "运营专员"; });

  var out = '<div class="score-grid">';
  filtered.forEach(function(p) {
    var objResult = calcObjectiveScore(p, p.role);
    var objScore = objResult.total;
    var objMax = objResult.details.reduce(function(s,d){return s+d.max;},0);
    var roleFields = SUBJECTIVE_FIELDS[p.role] || [];
    out += '<div class="score-card">';
    out += '<h4>'+p.name+' <span class="sub-text">'+p.role+' · '+p.region+'</span></h4>';

    // 客观分明细 - 按岗位显示不同指标
    objResult.details.forEach(function(d) {
      var targetStr = d.target ? ' (目标'+d.target+')' : '';
      out += '<div class="score-item"><span>'+d.name+' ('+fmt(d.val)+')'+targetStr+' → '+d.score+'分</span><span>/'+d.max+'</span></div>';
    });
    out += '<div class="score-item" style="background:#f0f7ff;border-radius:6px;padding:8px;margin-top:6px"><span><strong>客观小计</strong></span><span><strong>'+objScore+'</strong>/'+objMax+'</span></div>';
    
    // 主观分字段
    roleFields.forEach(function(f) {
      var val = subjectiveScores[p.name+"_"+f.key] || "";
      out += '<div class="score-item">';
      out += '<span>'+f.name+' ('+f.weight+')</span>';
      out += '<input class="score-input" type="number" min="0" max="'+parseInt(f.weight)*10+'" value="'+val+'" data-pname="'+p.name+'" data-fkey="'+f.key+'" onchange="updateScore(this.dataset.pname,this.dataset.fkey,this.value)">';
      out += '</div>';
      out += '<div class="hint-text">评分标准: '+f.hint+'</div>';
    });
    
    // 总分
    var subjTotal = calcSubjectiveTotal(p.name, p.role);
    var totalScore = objScore + subjTotal;
    out += '<div class="score-item" style="background:#e8f5e9;border-radius:6px;padding:10px 8px;margin-top:8px"><span><strong>总分</strong></span><span style="font-size:22px;color:#1a73e8;font-weight:700">'+fmt(totalScore)+'</span></div>';
    out += '</div>';
  });
  out += '</div>';
  $("perfContent").innerHTML = out;
}

function updateScore(person, fieldKey, value) {
  subjectiveScores[person+"_"+fieldKey] = value;
  updatePerformanceContent();
}

function calcSubjectiveTotal(person, role) {
  var fields = SUBJECTIVE_FIELDS[role] || [];
  var total = 0;
  fields.forEach(function(f) {
    var v = parseFloat(subjectiveScores[person+"_"+f.key]) || 0;
    total += v;
  });
  return total;
}


function initActionAnalysis() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var opCount = total.operators || 1;

  $("actionKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">人均触达</div><div class="value">'+fmt((total.touch||0)/opCount)+'</div><div class="trend">次/人</div></div>' +
    '<div class="kpi-card"><div class="label">人均校园行</div><div class="value">'+fmt((total.campus||0)/opCount)+'</div><div class="trend">场/人</div></div>' +
    '<div class="kpi-card"><div class="label">人均培训</div><div class="value">'+fmt((total.train||0)/opCount)+'</div><div class="trend">场/人</div></div>' +
    '<div class="kpi-card"><div class="label">平均结算率</div><div class="value">'+calcAvgSettle(md.people)+'%</div><div class="trend">基准: ≥90%</div></div>';

  // 雷达图 - TOP5按触达排序
  var people = (md.people || []).slice().sort(function(a,b){ return (b.touch||0)-(a.touch||0); }).slice(0,5);
  renderRadarChart("actionRadarChart", "TOP5运营人员能力雷达",
    people.map(function(p){return p.name;}),
    [{label:"有效触达",data:people.map(function(p){return p.touch||0;})},
     {label:"校园行",data:people.map(function(p){return p.campus||0;})},
     {label:"培训",data:people.map(function(p){return p.train||0;})},
     {label:"用户池",data:people.map(function(p){return p.user_pool||0;})}]
  );

  // 柱状图 - 各区域指标对比
  var regions = md.regions || {};
  var rNames = Object.keys(regions);
  renderGroupedBarChart("actionBarChart", "各区域核心指标对比",
    rNames.map(function(k){return regions[k].region;}),
    [{label:"触达",data:rNames.map(function(k){return regions[k].touch||0;}),color:"#1a73e8"},
     {label:"校园行",data:rNames.map(function(k){return regions[k].campus||0;}),color:"#22c55e"},
     {label:"培训",data:rNames.map(function(k){return regions[k].train||0;}),color:"#f59e0b"}]
  );
}

function calcAvgSettle(people) {
  if(!people || !people.length) return "0.0";
  var sum = 0, cnt = 0;
  people.forEach(function(p) {
    var sr = parseFloat(p.settle_rate);
    if(!isNaN(sr)) { sum += sr * 100; cnt++; }
  });
  return cnt > 0 ? (sum/cnt).toFixed(1) : "0.0";
}


function initUserPool() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var regions = md.regions || {};

  // KPI
  var poolTotal = total.user_pool || 0;
  var targetPool = (total.projects || 38) * 500;
  $("userPoolKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">用户池总量</div><div class="value">'+fmt(poolTotal)+'</div><div class="trend">目标: ≥'+targetPool+'</div></div>' +
    '<div class="kpi-card"><div class="label">本月新增(估)</div><div class="value">'+fmt(poolTotal*0.15)+'</div><div class="trend up">约15%增长率</div></div>' +
    '<div class="kpi-card"><div class="label">人均用户池</div><div class="value">'+fmt(poolTotal/(total.operators||1))+'</div><div class="trend">人/池</div></div>' +
    '<div class="kpi-card"><div class="label">目标完成率</div><div class="value">'+fmt((poolTotal/targetPool)*100)+'%</div><div class="trend '+(poolTotal>=targetPool?'up':'down')+'">'+(poolTotal>=targetPool?'已达标':'需努力')+'</div></div>';

  // 表格
  var tbody = "";
  Object.keys(regions).forEach(function(name) {
    var r = regions[name];
    var pool = r.user_pool || 0;
    var perPerson = r.members.length > 0 ? pool / r.members.length : 0;
    var regionTarget = r.projects * 500;
    var rate = regionTarget > 0 ? (pool / regionTarget * 100) : 0;
    var cls = statusClass(rate, 100);
    tbody += "<tr><td>"+r.region+"</td><td>"+fmt(pool)+"</td><td>"+fmt(pool*0.15)+"</td><td>"+fmt(perPerson)+"</td><td>"+fmt(rate)+"%</td><td>"+statusDot(cls)+(rate>=100?"达标":(rate>=70?"接近":"待提升"))+"</td></tr>";
  });
  $("userPoolTable").innerHTML = tbody;

  // 趋势图
  var months = Object.keys(WORKBENCH_DATA.totals).sort();
  var poolTrend = months.map(function(m) {
    var rgn = WORKBENCH_DATA.monthly_data[m].regions || {};
    var t = WORKBENCH_DATA.totals[m];
    return t.user_pool || 0;
  });
  renderLineChart("userPoolTrendChart", "用户池月度趋势", months, poolTrend, "#22c55e");

  // 区域对比
  var rNames = Object.keys(regions);
  renderBarChart("userPoolRegionChart", "各区域用户池",
    rNames.map(function(k){return regions[k].region;}),
    rNames.map(function(k){return regions[k].user_pool||0;})
  );
}


function initMarketing() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var regions = md.regions || {};

  // 从people计算订单总额和平均结算率
  var people = md.people || [];
  var orderTotal = 0, settleSum = 0, settleCnt = 0;
  people.forEach(function(p) {
    orderTotal += p.actual_order || 0;
    var sr = parseFloat(p.settle_rate);
    if(!isNaN(sr)) { settleSum += sr; settleCnt++; }
  });

  $("marketingKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">项目总数</div><div class="value">'+(total.projects||0)+'</div><div class="trend">在运营项目</div></div>' +
    '<div class="kpi-card"><div class="label">有效触达</div><div class="value">'+fmt(total.touch)+'</div><div class="trend">全平台累计</div></div>' +
    '<div class="kpi-card"><div class="label">订单总额(万)</div><div class="value">'+fmt(orderTotal/10000)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">平均结算率</div><div class="value">'+(settleCnt>0?fmt(settleSum/settleCnt*100):'0.0')+'%</div><div class="trend">基准: ≥90%</div></div>';

  // 表格
  var tbody = "";
  Object.keys(regions).forEach(function(name) {
    var r = regions[name];
    var t = r.touch || 0;
    // 该区域人员的订单额和结算率
    var rPeople = people.filter(function(p){ return p.leader === name; });
    var rOrder = 0, rSettle = 0, rSCnt = 0;
    rPeople.forEach(function(p) {
      rOrder += p.actual_order || 0;
      var sr = parseFloat(p.settle_rate);
      if(!isNaN(sr)) { rSettle += sr; rSCnt++; }
    });
    var avgSR = rSCnt > 0 ? (rSettle/rSCnt*100).toFixed(1) : "0.0";
    var cls = parseFloat(avgSR) >= 90 ? "ok" : (parseFloat(avgSR) >= 70 ? "warn" : "bad");
    tbody += "<tr><td>"+r.region+"</td><td>"+r.projects+"</td><td>"+fmt(t)+"</td><td>"+fmt(rOrder/10000)+"</td><td>"+avgSR+"%</td><td>"+statusDot(cls)+(parseFloat(avgSR)>=90?"达标":"待提升")+"</td></tr>";
  });
  $("marketingTable").innerHTML = tbody;

  // 组合图: 触达 vs 流量
  var rNames = Object.keys(regions);
  renderComboChart("marketingComboChart", "各区域触达-流量关系",
    rNames.map(function(k){return regions[k].region;}),
    rNames.map(function(k){return regions[k].touch||0;}),
    rNames.map(function(k){return regions[k].flow||0;})
  );

  // 饼图: 项目类型分布
  renderPieChart("marketingPieChart", "区域项目数分布",
    rNames.map(function(k){return regions[k].region;}),
    rNames.map(function(k){return regions[k].projects||0;})
  );
}


function initCampus() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var total = WORKBENCH_DATA.totals[currentMonth] || {};
  var people = md.people || [];

  var campusTotal = total.campus || 0;
  var trainTotal = total.train || 0;

  $("campusKPIs").innerHTML =
    '<div class="kpi-card"><div class="label">校园行总场次</div><div class="value">'+fmt(campusTotal)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">培训总场次</div><div class="value">'+fmt(trainTotal)+'</div><div class="trend up">本月累计</div></div>' +
    '<div class="kpi-card"><div class="label">参与运营人数</div><div class="value">'+people.length+'</div><div class="trend">人</div></div>' +
    '<div class="kpi-card"><div class="label">有校园行人数</div><div class="value">'+people.filter(function(p){return (p.campus||0)>0}).length+'</div><div class="trend up">活跃人员</div></div>';

  // 表格 - 显示每个人详情
  var tbody = "";
  people.forEach(function(p) {
    var cls = (p.campus||0) >= 2 ? "ok" : ((p.campus||0) > 0 ? "warn" : "bad");
    tbody += "<tr><td>"+p.name+"</td><td>"+p.role+"</td><td>"+p.region+"</td><td>"+p.school+"</td><td>"+(p.campus||0)+"</td><td>"+(p.train||0)+"</td><td>"+(p.touch||0)+"</td><td>"+statusDot(cls)+((p.campus||0)>=2?"积极":((p.campus||0)>0?"参与中":"待开展"))+"</td></tr>";
  });
  $("campusTable").innerHTML = tbody;

  // 趋势图
  var months = Object.keys(WORKBENCH_DATA.totals).sort();
  var campusTrend = months.map(function(m){ return (WORKBENCH_DATA.totals[m].campus||0); });
  renderLineChart("campusTrendChart", "校园行月度趋势", months, campusTrend, "#f59e0b");

  // TOP10 按校园行排序
  var topPeople = people.slice().sort(function(a,b){ return (b.campus||0)-(a.campus||0); }).slice(0,10);
  renderBarChart("campusTopChart", "校园行TOP10",
    topPeople.map(function(p){return p.name;}),
    topPeople.map(function(p){return p.campus||0;})
  );
}


function initSummary() {
  var md = WORKBENCH_DATA.monthly_data[currentMonth];
  if(!md) return;
  var people = md.people || [];

  // 计算每个人总分
  var scored = people.map(function(p) {
    var objResult = calcObjectiveScore(p, p.role);
    var obj = objResult.total;
    var subj = calcSubjectiveTotal(p.name, p.role);
    return {
      name:p.name, role:p.role, region:p.region,
      total: obj + subj, objective: obj, subjective: subj,
      user_pool:p.user_pool, touch:p.touch,
      campus:p.campus, train:p.train, flow:p.flow,
      actual_order:p.actual_order, settle_rate:p.settle_rate
    };
  });

  // 区域主管排行
  var leaders = scored.filter(function(p){ return p.role === "区域主管"; }).sort(function(a,b){ return b.total-a.total; });
  $("leaderRankList").innerHTML = leaders.length ? leaders.map(function(p,i) {
    return '<li class="rank-item"><span class="rank-num'+(i<3?' top3':'')+'">'+(i+1)+'</span><span class="rank-name">'+p.name+'('+p.region+')</span><span class="rank-score">'+fmt(p.total)+'</span></li>';
  }).join("") : '<li class="rank-item"><span style="color:#999">暂无数据</span></li>';

  // 其他人员排行
  var staff = scored.filter(function(p){ return p.role !== "区域主管"; }).sort(function(a,b){ return b.total-a.total; });
  $("staffRankList").innerHTML = staff.length ? staff.slice(0,15).map(function(p,i) {
    return '<li class="rank-item"><span class="rank-num'+(i<3?' top3':'')+'">'+(i+1)+'</span><span class="rank-name">'+p.name+' <span class="sub-text">'+p.role+'</span></span><span class="rank-score">'+fmt(p.total)+'</span></li>';
  }).join("") : '<li class="rank-item"><span style="color:#999">暂无数据</span></li>';

  // 关系图1: 区域主管绩效 vs 区域流量
  if(leaders.length > 0) {
    renderComboChart("summaryLeaderChart", "区域主管-绩效vs区域流量",
      leaders.map(function(p){return p.name;}),
      leaders.map(function(p){return p.total;}),
      leaders.map(function(p){return p.flow||0;})
    );
  }

  // 关系图2: 营销负责人绩效 vs 触达
  var mgrs = scored.filter(function(p){ return p.role === "项目营销负责人"; }).sort(function(a,b){ return b.total-a.total; });
  if(mgrs.length > 0) {
    renderComboChart("summaryMarketingChart", "营销负责人-绩效vs触达",
      mgrs.map(function(p){return p.name;}),
      mgrs.map(function(p){return p.total;}),
      mgrs.map(function(p){return p.touch||0;})
    );
  }

  // 关系图3: 运营专员绩效 vs 多指标
  var stf = scored.filter(function(p){ return p.role === "运营专员"; }).sort(function(a,b){ return b.total-a.total; });
  if(stf.length > 0) {
    renderMultiComboChart("summaryStaffChart", "运营专员-绩效vs多指标",
      stf.map(function(p){return p.name;}),
      stf.map(function(p){return p.total;}),
      [stf.map(function(p){return p.campus||0;}),
       stf.map(function(p){return p.train||0;}),
       stf.map(function(p){return p.user_pool||0;}),
       stf.map(function(p){return p.touch||0;})],
      ["校园行","培训","用户池","触达"]
    );
  }
}


function renderLineChart(canvasId, title, labels, data, color) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  allCharts[canvasId] = new Chart(ctx, {
    type:'line',
    data:{labels:labels, datasets:[{label:title, data:data, borderColor:color, backgroundColor:color+'20', fill:true, tension:0.3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:title}}, scales:{y:{beginAtZero:true}}}
  });
}

function renderBarChart(canvasId, title, labels, data) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  allCharts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels:labels, datasets:[{label:title, data:data, backgroundColor:'#1a73e880', borderColor:'#1a73e8', borderWidth:1}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:title}}, scales:{y:{beginAtZero:true}}}
  });
}

function renderRadarChart(canvasId, title, labels, datasets) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  var colors = ['#1a73e8','#22c55e','#f59e0b','#ef4444','#8b5cf6'];
  var ds = datasets.map(function(d,i){
    return {label:d.label, data:d.data, borderColor:colors[i], backgroundColor:colors[i]+'20'};
  });
  allCharts[canvasId] = new Chart(ctx, {
    type:'radar',
    data:{labels:labels, datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title}}, scales:{r:{beginAtZero:true}}}
  });
}

function renderGroupedBarChart(canvasId, title, labels, datasets) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  var ds = datasets.map(function(d){
    return {label:d.label, data:d.data, backgroundColor:(d.color||'#1a73e8')+'80', borderColor:d.color||'#1a73e8', borderWidth:1};
  });
  allCharts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels:labels, datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title}}, scales:{y:{beginAtZero:true}}}
  });
}

function renderComboChart(canvasId, title, labels, lineData, barData) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  allCharts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:labels,
      datasets:[
        {label:'指标(柱)', data:barData, backgroundColor:'#22c55e80', borderColor:'#22c55e', borderWidth:1, yAxisID:'y'},
        {type:'line', label:'绩效(线)', data:lineData, borderColor:'#ef4444', backgroundColor:'#ef444420', tension:0.3, yAxisID:'y1'}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title}},
      scales:{y:{beginAtZero:true,position:'left'}, y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false}}}}
  });
}

function renderMultiComboChart(canvasId, title, labels, lineData, barDatasets, barLabels) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  var barColors = ['#22c55e80','#f59e0b80','#8b5cf680','#1a73e880'];
  var ds = [{type:'line', label:'绩效(线)', data:lineData, borderColor:'#ef4444', backgroundColor:'#ef444420', tension:0.3, yAxisID:'y1'}];
  barDatasets.forEach(function(d,i) {
    ds.push({label:barLabels[i], data:d, backgroundColor:barColors[i], borderWidth:0, yAxisID:'y'});
  });
  allCharts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{labels:labels, datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title}},
      scales:{y:{beginAtZero:true,position:'left'}, y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false}}}}
  });
}

function renderPieChart(canvasId, title, labels, data) {
  if(allCharts[canvasId]) allCharts[canvasId].destroy();
  var ctx = $(canvasId);
  if(!ctx) return;
  var colors = ['#1a73e8','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  allCharts[canvasId] = new Chart(ctx, {
    type:'doughnut',
    data:{labels:labels, datasets:[{data:data, backgroundColor:colors.slice(0,data.length)}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:title}}}
  });
}


document.addEventListener("DOMContentLoaded", function() {
  renderMonthBtns();
  initOverview();
  initPerformance();
  initActionAnalysis();
  initUserPool();
  initMarketing();
  initCampus();
  initSummary();
});

</script>
